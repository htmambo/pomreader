<app-page-header title="书源管理" [subtitle]="'共 ' + sources().length + ' 个书源'"></app-page-header>
<app-book-source-tabs />

<div class="filter-bar">
  <input
    nz-input
    placeholder="搜索书源（名称 / 作者 / 标签）"
    [(ngModel)]="filter"
    class="filter-input"
  />
  <button nz-button (click)="openSmartAdd()">
    <span nz-icon nzType="thunderbolt"></span> 添加书源
  </button>
  <button nz-button nzType="primary" (click)="openLegadoImport()">
    <span nz-icon nzType="import"></span> 导入 Legado 源
  </button>
</div>

@if (!loading() && sources().length === 0) {
  <nz-empty nzNotFoundContent="暂无书源"></nz-empty>
} @else {
  <div class="source-list">
    @for (src of filtered(); track src.fileName) {
      <div class="source-card">
        <div class="source-info">
          <h3>{{ src.name }}</h3>
          <p class="meta">{{ src.author || '未知作者' }} · {{ src.url || '无 URL' }}</p>
          @if (src.description) {
            <p class="desc">{{ src.description }}</p>
          }
          <div class="tags">
            @for (tag of src.tags; track tag) {
              <nz-tag>{{ tag }}</nz-tag>
            }
          </div>
        </div>
        <div class="source-actions">
          <nz-switch [ngModel]="src.enabled" (ngModelChange)="toggle(src, $event)"></nz-switch>
          <button nz-button nzSize="small" (click)="openEditor(src)">编辑</button>
          <button nz-button nzSize="small" (click)="openDebug(src)">调试</button>
          <button nz-button nzSize="small" nzDanger (click)="confirmDelete(src)">删除</button>
        </div>
      </div>
    }
  </div>
}
