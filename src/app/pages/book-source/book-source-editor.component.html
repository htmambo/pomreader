<app-page-header title="编辑书源" [subtitle]="isNew() ? '新建' : fileName"></app-page-header>

<div class="editor">
  <textarea
    class="source-text"
    rows="30"
    spellcheck="false"
    placeholder="// @name 我的书源&#10;// @url https://example.com&#10;..."
    [ngModel]="source()"
    (ngModelChange)="source.set($event)"
    [disabled]="saving()"
  ></textarea>

  <div class="meta-preview">
    <h4>解析预览</h4>
    <pre>{{ metaPreview() }}</pre>
  </div>

  <div class="actions">
    <button nz-button (click)="cancel()" [disabled]="saving()">取消</button>
    @if (isNew()) {
      <button nz-button (click)="showAiDialog.set(true)" [disabled]="saving()">
        <span nz-icon nzType="robot"></span> AI 生成
      </button>
    }
    <button nz-button nzType="primary" [disabled]="saving()" (click)="save()">
      {{ saving() ? '保存中...' : '保存' }}
    </button>
  </div>
</div>

@if (showAiDialog()) {
  <nz-modal
    [nzVisible]="showAiDialog()"
    nzTitle="AI 生成书源（v1 mock 模板）"
    (nzOnCancel)="showAiDialog.set(false)"
  >
    <ng-container *nzModalContent>
      <p class="hint">输入书源名称和 URL，生成基础模板（v1 仅 mock，v2 接真实 LLM）</p>
      <input
        nz-input
        placeholder="书源名称"
        [ngModel]="draftName()"
        (ngModelChange)="draftName.set($event)"
      />
      <input
        nz-input
        placeholder="书源 URL"
        [ngModel]="draftUrl()"
        (ngModelChange)="draftUrl.set($event)"
        style="margin-top: 12px;"
      />
    </ng-container>
    <div *nzModalFooter>
      <button nz-button (click)="showAiDialog.set(false)">取消</button>
      <button
        nz-button
        nzType="primary"
        [disabled]="!draftName().trim() || !draftUrl().trim()"
        (click)="aiGenerate()"
      >生成</button>
    </div>
  </nz-modal>
}
